name: AI Ready Data submission
description: Submit one public-safe ARD product for validation and Ossie conversion
title: "[ARD] "
labels:
  - ard:submission
body:
  - type: markdown
    attributes:
      value: |
        저장소, Issue, 첨부파일, 생성 결과와 Release는 누구나 볼 수 있습니다.
        공개 권한이 있는 합성·비기밀 데이터만 제출하고 비밀정보, 개인정보, 고객 데이터, 내부 문서, 접근 토큰을 첨부하지 마세요.
  - type: checkboxes
    id: public_authorization
    attributes:
      label: Public publication authorization
      options:
        - label: I am authorized to publish this synthetic, non-confidential content publicly.
          required: true
  - type: dropdown
    id: operation
    attributes:
      label: Operation
      options:
        - create
        - update
    validations:
      required: true
  - type: input
    id: product_key
    attributes:
      label: Product key
      description: Lowercase kebab-case identifier, for example sales-order
    validations:
      required: true
  - type: input
    id: product_id
    attributes:
      label: Existing product ID
      description: Must be empty for create; required for update
  - type: input
    id: version
    attributes:
      label: Requested version
      description: Numeric version from 1 through 999, optionally prefixed with v
    validations:
      required: true
  - type: input
    id: display_name
    attributes:
      label: Display name
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
  - type: input
    id: changeset_id
    attributes:
      label: Changeset ID
      description: Required when updating a table shared by multiple products
  - type: textarea
    id: product_html
    attributes:
      label: Product HTML
      description: Attach exactly one .html or .htm file; do not paste an external URL
    validations:
      required: true
  - type: textarea
    id: semantic_document
    attributes:
      label: Semantic document
      description: Attach exactly one .docx or .pdf file; do not paste an external URL
    validations:
      required: true
  - type: textarea
    id: dictionary_excel
    attributes:
      label: Data dictionary
      description: Attach exactly one .xlsx file; do not paste an external URL
    validations:
      required: true
  - type: textarea
    id: change_reason
    attributes:
      label: Change reason
      description: Explain why this product/version should be created or changed
    validations:
      required: true
