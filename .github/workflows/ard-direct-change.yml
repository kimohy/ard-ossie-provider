name: ARD direct branch change

on:
  push:
    branches-ignore: [main]
    paths:
      - products/*/sources/**
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - products/*/sources/**

concurrency:
  group: ard-direct-${{ github.event.pull_request.head.label || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      product_key: ${{ steps.detect.outputs.product_key }}
      expected_head: ${{ steps.detect.outputs.expected_head }}
      merge_base: ${{ steps.detect.outputs.merge_base }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.33'
      - name: Detect exactly one changed product
        id: detect
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: >-
          uv run --frozen ard workflow detect-product
          --base-ref "$BASE_REF"

  source-check:
    needs: detect
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout untrusted source without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.detect.outputs.expected_head }}
          persist-credentials: false
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.33'
      - name: Validate sources without LLM credentials
        id: source_check
        env:
          PRODUCT_KEY: ${{ needs.detect.outputs.product_key }}
          EXPECTED_HEAD: ${{ needs.detect.outputs.expected_head }}
        run: >-
          uv run --frozen ard workflow source-check
          --product-key "$PRODUCT_KEY"
          --expected-head "$EXPECTED_HEAD"

  pull_request:
    needs: [detect, source-check]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    outputs:
      pr_number: ${{ steps.pull_request.outputs.pr_number }}
      expected_head: ${{ steps.pull_request.outputs.expected_head }}
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.ref_name }}
      PRODUCT_KEY: ${{ needs.detect.outputs.product_key }}
      EXPECTED_HEAD: ${{ needs.detect.outputs.expected_head }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      REPOSITORY_NAME: ${{ github.repository }}
    steps:
      - name: Checkout trusted PR coordinator code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.33'
      - name: Ensure one Draft product PR
        id: pull_request
        run: >-
          uv run --frozen ard workflow ensure-product-pr
          --branch "$BRANCH"
          --product-key "$PRODUCT_KEY"
          --expected-head "$EXPECTED_HEAD"
          --base-branch "$BASE_BRANCH"
          --repository-name "$REPOSITORY_NAME"

  process:
    needs: [detect, source-check, pull_request]
    if: github.event_name == 'push'
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/ard-process.yml
    with:
      branch: ${{ github.ref_name }}
      product_key: ${{ needs.detect.outputs.product_key }}
      pr_number: ${{ fromJSON(needs.pull_request.outputs.pr_number) }}
      expected_head: ${{ needs.detect.outputs.expected_head }}
      allow_writeback: true
