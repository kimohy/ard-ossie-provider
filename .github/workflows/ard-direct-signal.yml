name: ARD direct branch signal

on:
  push:
    branches-ignore: [main]
    paths:
      - products/*/sources/**

permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Acknowledge the exact source commit without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
