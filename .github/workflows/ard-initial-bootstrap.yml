name: ARD initial bootstrap gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ard-initial-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verification:
    name: ARD initial bootstrap / ${{ matrix.verification_group }}
    if: >-
      github.event.pull_request.number == 1 &&
      github.event.pull_request.base.sha == 'c23333610cb1d27ff136910de010011b6c870f3a' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/design-numeric-versions-actions'
    strategy:
      fail-fast: false
      matrix:
        verification_group: [static, pytest, wheel]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      BASE_REF: ${{ github.event.pull_request.base.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CANDIDATE_REPOSITORY: ${{ github.workspace }}/candidate
      VERIFICATION_GROUP: ${{ matrix.verification_group }}
    steps:
      - name: Checkout immutable trusted verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: cb79416c4585d383181e75e7f87579bbf368ca65
          path: trusted
          persist-credentials: false
      - name: Checkout exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.33'
      - name: Run one isolated bootstrap verifier
        id: repository_check
        working-directory: trusted
        run: >-
          uv run --frozen ard workflow repository-check
          --base-ref "$BASE_REF"
          --head-ref "$HEAD_REF"
          --head-sha "$HEAD_SHA"
          --repository "$CANDIDATE_REPOSITORY"
          --verification-group "$VERIFICATION_GROUP"

  aggregate:
    name: ARD initial bootstrap aggregate
    needs: verification
    if: >-
      always() &&
      github.event.pull_request.number == 1 &&
      github.event.pull_request.base.sha == 'c23333610cb1d27ff136910de010011b6c870f3a' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/design-numeric-versions-actions'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require every isolated verifier to succeed
        id: aggregate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          VERIFICATION_RESULT: ${{ needs.verification.result }}
        with:
          script: |
            if (process.env.VERIFICATION_RESULT !== 'success') {
              core.setFailed(
                `Bootstrap verification result: ${process.env.VERIFICATION_RESULT}`
              )
            }
