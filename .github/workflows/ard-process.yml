name: ARD reusable processor

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      product_key:
        required: true
        type: string
      pr_number:
        required: true
        type: number
      expected_head:
        required: true
        type: string
      allow_writeback:
        required: true
        type: boolean
    outputs:
      current_head:
        value: ${{ jobs.process.outputs.current_head }}
      product_id:
        value: ${{ jobs.process.outputs.product_id }}
      version:
        value: ${{ jobs.process.outputs.version }}

concurrency:
  group: ard-registry-write
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-24.04
    environment: ard-llm
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    outputs:
      current_head: ${{ steps.processor.outputs.current_head || steps.reconcile.outputs.current_head || steps.processor_readonly.outputs.current_head }}
      product_id: ${{ steps.processor.outputs.product_id || steps.reconcile.outputs.product_id || steps.processor_readonly.outputs.product_id }}
      version: ${{ steps.processor.outputs.version || steps.reconcile.outputs.version || steps.processor_readonly.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      ARD_LLM_API_KEY: ${{ secrets.ARD_LLM_API_KEY }}
      ARD_LLM_BASE_URL: ${{ secrets.ARD_LLM_BASE_URL || vars.ARD_LLM_BASE_URL || 'https://api.openai.com/v1' }}
      ARD_LLM_MODEL: ${{ vars.ARD_LLM_MODEL }}
      ARD_LLM_API_STYLE: ${{ vars.ARD_LLM_API_STYLE || 'chat_completions' }}
      PRODUCT_KEY: ${{ inputs.product_key }}
      BRANCH: ${{ inputs.branch }}
      PR_NUMBER: ${{ inputs.pr_number }}
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      REPOSITORY_NAME: ${{ github.repository }}
      TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout the exact validated head with LFS
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.expected_head }}
          fetch-depth: 0
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.33'
      - name: Process and publish exact-head results
        id: processor
        if: inputs.allow_writeback
        continue-on-error: true
        run: >-
          uv run --frozen ard workflow process
          --product-key "$PRODUCT_KEY"
          --branch "$BRANCH"
          --pr-number "$PR_NUMBER"
          --expected-head "$EXPECTED_HEAD"
          --repository-name "$REPOSITORY_NAME"
          --allow-writeback
          --target-url "$TARGET_URL"
      - name: Reconcile a same-job partial publication
        id: reconcile
        if: inputs.allow_writeback && steps.processor.outcome == 'failure'
        env:
          RESULT_PATH: .ard/run/workflow.process-result.json
        run: >-
          uv run --frozen ard workflow process-reconcile
          --result-path "$RESULT_PATH"
          --branch "$BRANCH"
          --pr-number "$PR_NUMBER"
          --repository-name "$REPOSITORY_NAME"
          --target-url "$TARGET_URL"
      - name: Process without writeback
        id: processor_readonly
        if: ${{ !inputs.allow_writeback }}
        run: >-
          uv run --frozen ard workflow process
          --product-key "$PRODUCT_KEY"
          --branch "$BRANCH"
          --pr-number "$PR_NUMBER"
          --expected-head "$EXPECTED_HEAD"
          --repository-name "$REPOSITORY_NAME"
          --no-allow-writeback
          --target-url "$TARGET_URL"
      - name: Upload public quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ard-quality-${{ inputs.product_key }}-${{ github.run_id }}
          path: |
            products/${{ inputs.product_key }}/quality
            .ard/run/workflow.process-result.json
            .ard/run/workflow.process-reconcile-result.json
          retention-days: 30
          if-no-files-found: warn

  finalize:
    needs: process
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_RESULT: ${{ needs.process.result }}
      REPOSITORY_NAME: ${{ github.repository }}
      PR_NUMBER: ${{ inputs.pr_number }}
      EXPECTED_HEAD: ${{ needs.process.outputs.current_head || inputs.expected_head }}
      TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout trusted finalizer code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.33'
      - name: Reconcile PR and missing failure statuses
        id: finalizer
        run: >-
          uv run --frozen ard workflow finalize
          --upstream-result "$UPSTREAM_RESULT"
          --repository-name "$REPOSITORY_NAME"
          --pr-number "$PR_NUMBER"
          --expected-head "$EXPECTED_HEAD"
          --target-url "$TARGET_URL"
