name: ARD repository change gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ard-repository-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    outputs:
      code_only: ${{ steps.repository_check.outputs.code_only }}
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_REF: ${{ github.event.pull_request.base.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REPOSITORY_NAME: ${{ github.repository }}
      TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout exact pull request head without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.33'
      - name: Classify and verify repository change
        id: repository_check
        run: >-
          uv run --frozen ard workflow repository-check
          --base-ref "$BASE_REF"
          --head-ref "$HEAD_REF"
          --head-sha "$HEAD_SHA"
          --repository-name "$REPOSITORY_NAME"
          --target-url "$TARGET_URL"

  finalize:
    needs: check
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_RESULT: ${{ needs.check.result }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      REPOSITORY_NAME: ${{ github.repository }}
      TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout trusted finalizer code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.33'
      - name: Publish missing repository failure statuses
        id: finalizer
        run: >-
          uv run --frozen ard workflow finalize
          --upstream-result "$UPSTREAM_RESULT"
          --repository-name "$REPOSITORY_NAME"
          --expected-head "$EXPECTED_HEAD"
          --target-url "$TARGET_URL"
